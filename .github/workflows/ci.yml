name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" re-runs CI when a stacked PR is retargeted onto main.
    types: [opened, synchronize, reopened, edited]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Bash syntax check
        run: |
          status=0
          for f in bin/ai-consultants scripts/*.sh scripts/lib/*.sh benchmarks/breadth-v1/scripts/*.sh benchmarks/breadth-v1/fixtures/stub-adapters/*.sh; do
            if ! bash -n "$f"; then
              echo "FAIL: $f"
              status=1
            fi
          done
          exit $status

      - name: ShellCheck lint
        run: |
          npm run lint

      - name: Run full test suite
        run: npm test

      - name: Doctor health check (informational)
        continue-on-error: true
        run: |
          chmod +x scripts/doctor.sh
          ./scripts/doctor.sh --quick
